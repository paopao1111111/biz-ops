<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 周度经营看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0055FF;--bg:#F7F8FA;--white:#fff;--gray100:#F0F1F3;--gray300:#D0D3D9;--gray500:#8C9099;--gray700:#4A4D54;--gray900:#1A1D24;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06)}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--gray900)}
body{display:flex;align-items:center;justify-content:center}
.login-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:48px 40px;width:380px;max-width:90vw}
.login-card h1{font-size:20px;font-weight:600;margin-bottom:4px}
.login-card p{font-size:13px;color:var(--gray500);margin-bottom:32px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--gray700);margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--gray300);border-radius:8px;font-size:14px;outline:none;transition:border .15s}
.field input:focus{border-color:var(--blue)}
.btn{display:block;width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.error{color:#D32F2F;font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="login-card">
  <h1>周度经营看板</h1>
  <p>iWeaver · Palmly · Learning Coach</p>
  <form id="loginForm">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" id="submitBtn">登录</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('error');
  btn.disabled = true;
  errEl.textContent = '';
  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      window.location.href = '/';
    } else {
      errEl.textContent = '用户名或密码错误';
    }
  } catch (err) {
    errEl.textContent = '网络错误，请重试';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
