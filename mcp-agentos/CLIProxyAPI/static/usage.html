<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLI Proxy 用量审计</title>
  <style>
    body{margin:0;background:#0b1020;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 24px;border-bottom:1px solid #24304a;display:flex;justify-content:space-between;align-items:center}main{padding:20px 24px}.bar{display:grid;grid-template-columns:minmax(260px,520px) auto auto;gap:10px;margin-bottom:16px}input,button{border:1px solid #334155;background:#111827;color:#e5e7eb;border-radius:8px;padding:9px 11px;font-size:14px}button{cursor:pointer;background:#2563eb;border-color:#2563eb;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#111827;border-color:#334155}a{color:#93c5fd;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:18px 0}.card{background:#111827;border:1px solid #1f2a44;border-radius:12px;padding:14px}.label{color:#94a3b8;font-size:12px;margin-bottom:8px}.value{font-size:24px;font-weight:700}section{background:#0f172a;border:1px solid #1f2a44;border-radius:12px;overflow:hidden;margin-top:18px}h1{font-size:20px;margin:0}h2{margin:0;padding:14px 16px;border-bottom:1px solid #1f2a44;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pager{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400}.pager button{padding:5px 9px}.table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #1f2a44;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#111827;color:#cbd5e1}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:#94a3b8}.ok{color:#86efac}.bad{color:#fca5a5}.warn{color:#fde68a}pre{margin:0;padding:12px;overflow:auto;color:#cbd5e1}@media(max-width:900px){.bar,.cards{grid-template-columns:1fr}h2{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><h1>CLI Proxy 用量审计</h1><a href="/management.html">返回管理面板</a></header>
<main>
  <div class="bar"><input id="key" type="password" placeholder="管理密钥"><button id="load">刷新用量</button><button class="secondary" id="forget">清除密钥</button></div>
  <div id="status" class="muted">输入管理密钥后点击刷新；密钥只保存在本机浏览器。</div>
  <div class="cards"><div class="card"><div class="label">审计 API Key 数</div><div class="value" id="keyCount">-</div></div><div class="card"><div class="label">审计请求总数</div><div class="value" id="reqCount">-</div></div><div class="card"><div class="label">统计项</div><div class="value" id="usageCount">-</div></div><div class="card"><div class="label">最后刷新</div><div class="value" id="lastRefresh" style="font-size:16px">-</div></div></div>
  <section><h2>API Key 用量汇总</h2><div class="table-wrap"><table id="keysTable"><thead><tr><th>API Key</th><th>请求数</th><th>最后使用</th><th>Hash</th></tr></thead><tbody></tbody></table></div></section>
  <section><h2><span>请求审计明细</span><span class="pager"><button class="secondary" id="prevPage">上一页</button><span id="pageMeta">-</span><button class="secondary" id="nextPage">下一页</button></span></h2><div class="table-wrap"><table id="reqTable"><thead><tr><th>时间</th><th>Provider</th><th>模型</th><th>接口</th><th>API Key</th><th>状态</th><th>输入</th><th>输出</th><th>费用/额度</th><th>请求ID</th></tr></thead><tbody></tbody></table></div></section>
  <section><h2>内置 api-key-usage 原始统计</h2><pre id="rawUsage">-</pre></section>
</main>
<script>
(function(){
  const KEY_NAME='cliproxy_management_key';
  const PAGE_SIZE=500;
  const RETENTION_DAYS=90;
  const state={offset:0,total:0,loading:false,generation:0};
  const $=id=>document.getElementById(id);
  const keyInput=$('key'); keyInput.value=localStorage.getItem(KEY_NAME)||'';
  function status(text,cls='muted'){const el=$('status');el.className=cls;el.textContent=text;}
  function fmt(value){const n=Number(value);return Number.isFinite(n)?n.toLocaleString():String(value??'');}
  function todayString(){const d=new Date();return d.toISOString().slice(0,10);}
  function dateDaysAgo(days){const d=new Date();d.setDate(d.getDate()-days);return d.toISOString().slice(0,10);}
  function auditRange(){return {start_date:dateDaysAgo(RETENTION_DAYS-1),end_date:todayString()};}
  async function api(path,params){
    const key=keyInput.value.trim();
    if(!key)throw new Error('请先输入管理密钥');
    localStorage.setItem(KEY_NAME,key);
    const query=new URLSearchParams();
    for(const [name,value] of Object.entries(params||{})){if(value!==''&&value!=null)query.set(name,String(value));}
    const url='/v0/management'+path+(query.toString()?'?'+query.toString():'');
    const res=await fetch(url,{headers:{Authorization:'Bearer '+key}});
    const txt=await res.text();let data;try{data=txt?JSON.parse(txt):null}catch{data=txt}
    if(!res.ok)throw new Error((data&&data.error)||txt||('HTTP '+res.status));
    return data;
  }
  function td(v,cls=''){const e=document.createElement('td');if(cls)e.className=cls;e.textContent=v==null?'':String(v);return e;}
  function fillKeys(items){const body=$('keysTable').querySelector('tbody');body.textContent='';for(const item of items){const tr=document.createElement('tr');tr.append(td(item.api_key_display||'','mono'),td(fmt(item.request_count||0)),td(item.last_seen_at||'','mono'),td(item.api_key_hash||'','mono'));body.append(tr);}}
  function fillReq(items){const body=$('reqTable').querySelector('tbody');body.textContent='';if(!items.length){const tr=document.createElement('tr');const cell=td('暂无数据','muted');cell.colSpan=10;tr.append(cell);body.append(tr);return;}for(const item of items){const tr=document.createElement('tr');tr.append(td(item.timestamp||item.date||'','mono'),td(item.provider||''),td(item.model||item.alias||''),td(item.endpoint||''),td(item.api_key_display||item.api_key_hash||'','mono'),td(item.status||item.status_code||item.error||'',item.error?'bad':'ok'),td(fmt(item.input_tokens??item.prompt_tokens??'')),td(fmt(item.output_tokens??item.completion_tokens??'')),td(item.cost??item.credits??item.quota??''),td(item.request_id||'','mono'));body.append(tr);}}
  function countUsage(obj){let n=0;function walk(x){if(!x||typeof x!=='object')return;if('success'in x||'failed'in x||'recent_requests'in x)n++;for(const v of Object.values(x))walk(v)}walk(obj);return n;}
  function updatePager(){
    const start=state.total&&state.offset<state.total?state.offset+1:0;
    const end=Math.min(state.offset+PAGE_SIZE,state.total);
    $('pageMeta').textContent=fmt(start)+'–'+fmt(end)+' / '+fmt(state.total);
    $('prevPage').disabled=state.loading||state.offset<=0;
    $('nextPage').disabled=state.loading||state.offset+PAGE_SIZE>=state.total;
  }
  async function loadRequestPage(generation){
    state.loading=true;updatePager();status('正在读取请求明细...','warn');
    const reqs=await api('/usage-audit/requests',{limit:PAGE_SIZE,offset:state.offset,...auditRange()});
    if(generation!==state.generation)return;
    const items=Array.isArray(reqs.items)?reqs.items:[];
    const serverTotal=Number(reqs.total);
    state.total=Number.isFinite(serverTotal)&&serverTotal>=0?serverTotal:items.length;
    if(state.total>0&&state.offset>=state.total){state.offset=Math.floor((state.total-1)/PAGE_SIZE)*PAGE_SIZE;return loadRequestPage(generation);}
    fillReq(items);$('reqCount').textContent=fmt(state.total);
    state.loading=false;updatePager();
  }
  async function load(){
    const generation=++state.generation;
    state.offset=0;state.loading=true;updatePager();
    try{
      status('正在读取用量...','warn');
      const [usage,keys]=await Promise.all([api('/api-key-usage'),api('/usage-audit/api-keys')]);
      if(generation!==state.generation)return;
      const keyItems=Array.isArray(keys.items)?keys.items:[];
      fillKeys(keyItems);
      $('rawUsage').textContent=JSON.stringify(usage,null,2).slice(0,60000);
      $('keyCount').textContent=fmt(keyItems.length);
      $('usageCount').textContent=fmt(countUsage(usage));
      await loadRequestPage(generation);
      if(generation!==state.generation)return;
      $('lastRefresh').textContent=new Date().toLocaleString();
      status('用量读取成功。统计范围为审计保留的最近 '+RETENTION_DAYS+' 天；请求总数来自服务端 total，明细按页加载。','ok');
    }catch(e){if(generation!==state.generation)return;state.loading=false;updatePager();status('读取失败：'+e.message,'bad');}
  }
  async function movePage(delta){
    if(state.loading)return;
    const next=Math.max(0,state.offset+delta*PAGE_SIZE);
    if(next>=state.total&&state.total>0)return;
    state.offset=next;
    const generation=++state.generation;
    try{await loadRequestPage(generation);if(generation===state.generation)status('请求明细已更新。','ok');}
    catch(e){if(generation===state.generation){state.loading=false;updatePager();status('读取失败：'+e.message,'bad');}}
  }
  $('load').onclick=load;
  $('prevPage').onclick=()=>movePage(-1);
  $('nextPage').onclick=()=>movePage(1);
  $('forget').onclick=function(){++state.generation;localStorage.removeItem(KEY_NAME);keyInput.value='';state.offset=0;state.total=0;state.loading=false;updatePager();status('已清除本机保存的管理密钥。');};
  updatePager();if(keyInput.value)load();
})();
</script>
</body>
</html>
